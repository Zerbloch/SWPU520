<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#5566f2" />
<title>校园工作台 · 移动端</title>
<!--
  移动端外壳：底部 TabBar + 顶部用户栏 + 页面挂载点。
  复用 /css/base.css（按钮/表单/模态框/Toast/分段控件）+
       /mobile/css/mobile.css（移动端布局与移动端专属组件）。
  业务数据层与核心工具完全复用桌面端（/js/core、/js/data、/js/features），
  只有页面布局与外壳是移动端专属的。
-->
<link rel="stylesheet" href="/css/base.css" />
<link rel="stylesheet" href="/mobile/css/mobile.css" />
</head>
<body>

<!-- ==================== 登录 / 注册 ==================== -->
<div class="m-auth" id="auth-view">
  <div class="m-auth-hero">
    <div class="m-auth-brand">
      <div class="m-auth-logo">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 4 2 10l10 6 10-6Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </div>
      <span>Campus Desk</span>
    </div>
    <h1>你的课表，<br/>你的文件，随时随地。</h1>
    <p>登录后在手机上也能管理课表与文件</p>
  </div>

  <div class="m-auth-body">
    <div class="m-auth-box">
      <!-- 登录 -->
      <div id="login-pane">
        <h2>欢迎回来</h2>
        <p class="m-sub">登录以查看你的课表与文件</p>
        <form class="auth-form" id="login-form" autocomplete="on">
          <div class="form-msg" id="login-msg"></div>
          <label class="field">
            <span>用户名</span>
            <input id="login-user" name="username" placeholder="请输入用户名" autocomplete="username" />
          </label>
          <label class="field">
            <span>密码</span>
            <input id="login-pass" type="password" name="password" placeholder="请输入密码" autocomplete="current-password" />
          </label>
          <div class="row-between">
            <label class="checkbox"><input type="checkbox" id="login-remember" checked /> 记住我</label>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-demo">一键体验</button>
          </div>
          <button type="submit" class="btn btn-primary btn-block">登录</button>
        </form>
        <div class="auth-switch">还没有账号？<button type="button" id="go-register">立即注册</button></div>
      </div>

      <!-- 注册 -->
      <div id="register-pane" hidden>
        <h2>创建账号</h2>
        <p class="m-sub">30 秒完成，立刻拥有自己的课表</p>
        <form class="auth-form" id="register-form">
          <div class="form-msg" id="register-msg"></div>
          <label class="field">
            <span>用户名</span>
            <input id="reg-user" placeholder="3-20 位字母、数字或下划线" autocomplete="username" />
          </label>
          <label class="field">
            <span>显示昵称（选填）</span>
            <input id="reg-name" placeholder="例如：小林" />
          </label>
          <label class="field">
            <span>密码</span>
            <input id="reg-pass" type="password" placeholder="至少 6 位" autocomplete="new-password" />
          </label>
          <label class="field">
            <span>确认密码</span>
            <input id="reg-pass2" type="password" placeholder="再次输入密码" autocomplete="new-password" />
          </label>
          <button type="submit" class="btn btn-primary btn-block">注册并进入</button>
        </form>
        <div class="auth-switch">已有账号？<button type="button" id="go-login">返回登录</button></div>
      </div>
    </div>
  </div>
</div>

<!-- ==================== 主应用 ==================== -->
<div class="m-app" id="app-view" hidden>
  <header class="m-topbar">
    <div class="m-brand">
      <div class="m-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 4 2 10l10 6 10-6Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </div>
      <span>Campus Desk</span>
    </div>
    <div class="m-user">
      <span class="avatar" id="side-avatar">U</span>
      <div class="user-meta">
        <b id="side-name">用户</b>
        <span id="side-user">@user</span>
      </div>
      <button class="icon-btn" id="btn-logout" title="退出登录">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
      </button>
    </div>
  </header>

  <!-- 页面由 js/pages/*.js 渲染到这里 -->
  <main class="m-main" id="page-host"></main>

  <!-- 底部导航由 js/shell.js 根据页面注册表自动生成 -->
  <nav class="m-tabbar" id="nav"></nav>
</div>

<!-- ==================== 模态框（复用桌面端 openModal） ==================== -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="icon-btn" id="modal-close" aria-label="关闭">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="toasts"></div>

<!-- ==================== 文件预览器（复用 features/viewer.js） ==================== -->
<div class="viewer" id="viewer" hidden>
  <div class="viewer-bar">
    <div class="viewer-title">
      <div class="vname" id="viewer-name">文件名</div>
      <div class="vmeta" id="viewer-meta"></div>
    </div>
    <div class="viewer-actions">
      <button class="viewer-btn" id="viewer-download">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
        下载
      </button>
      <button class="viewer-btn primary" id="viewer-close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        关闭
      </button>
    </div>
  </div>
  <div class="viewer-body" id="viewer-body"></div>
</div>

<script type="module" src="/mobile/js/app.js"></script>
</body>
</html>
