# ============================================================
# Campus Desk · Cloudflare Pages 项目配置
# ------------------------------------------------------------
# 重要：本文件刻意保持「最小」——只有 name 和 compatibility_date。
#
# 为什么不写 pages_build_output_dir / [vars] / 绑定？
#   Cloudflare Pages 的规则：只要 wrangler 配置文件里出现
#   pages_build_output_dir、[vars] 或任何绑定，这个文件就会成为
#   项目的「配置源」，控制台 Settings → Bindings 与
#   Variables and Secrets 会变成只读，Add 按钮变灰。
#
#   因此本项目把「构建输出目录 / 绑定 / 环境变量 / 密钥」
#   全部放在 Cloudflare 控制台里配置：
#     · 构建输出目录 : public
#     · D1 绑定       : 变量名 DB    → campus-desk-db
#     · R2 绑定       : 变量名 FILES → campus-desk-files
#     · 密钥          : APP_SECRET（Secret）、AI_API_KEY（可选，Secret）
#
#   详见 DEPLOY-D1-R2.md
#
# 注意：代码里所有环境变量都有默认值，缺少也不会崩：
#     AI_BASE_URL  默认 https://api.openai.com/v1
#     AI_MODEL     默认 gpt-4o-mini
#     AI_CACHE_MINUTES 默认 30
#     未配置 AI_API_KEY 时，首页 AI 卡片自动隐藏，其余功能不受影响。
# ============================================================

name = "campus-desk"
compatibility_date = "2024-11-01"
